name: Self Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          architecture: x64
      - run: python src/scripts/build_lunatranslator.py cpp x64 win10
      - run: python src/scripts/build_lunatranslator.py hook x64 win10
      - run: python src/scripts/build_lunatranslator.py pyrt x64 3.13.13 win10
      - run: python src/scripts/build_lunatranslator.py merge x64 win10
      - uses: actions/upload-artifact@v7
        with:
          name: LunaTranslator_x64
          path: src/build/LunaTranslator_x64

  release:
    runs-on: windows-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: LunaTranslator_x64
          path: build/LunaTranslator_x64
      - name: Pack zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packed | Out-Null
          $src = "build"
          if (Test-Path "build/LunaTranslator_x64") {
            $src = "build/LunaTranslator_x64"
          }
          if (-not (Test-Path "$src/LunaTranslator.exe")) {
            throw "LunaTranslator.exe missing under $src"
          }
          $stage = "LunaTranslator_x64"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Move-Item $src $stage
          $zip = Join-Path (Resolve-Path packed) "LunaTranslator_x64.zip"
          tar -a -c -f $zip $stage
          Get-ChildItem packed
          tar -tf $zip | Select-Object -First 20
      - name: Load version
        id: loadversion
        run: python src/scripts/build_lunatranslator.py loadversion | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.loadversion.outputs.version }}-self
          name: ${{ steps.loadversion.outputs.version }} Windows (self)
          body: |
            非官方自用构建，未使用 SignPath 签名。

            基于 fork 修改：大模型查词可同时查询已启用辞书作为参考。

            请使用 `LunaTranslator_x64.zip`（Windows 10/11 64 位）。解压后运行 `LunaTranslator.exe`。
            需要 HOOK 游戏时使用 `LunaTranslator_admin.exe`。
          files: packed/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
